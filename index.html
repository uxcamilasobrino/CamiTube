<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamiTube</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23C1121F%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wordmark">
      <span class="dot" aria-hidden="true"></span>
      <span class="wordmark-text">CamiTube</span>
    </div>
    <span id="updatedAt" class="updated-at"></span>
  </header>

  <nav id="filterRow" class="filter-row" aria-label="Filter by channel"></nav>

  <main id="main">
    <div id="status" class="status" hidden></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div class="loadmore-wrap">
      <button id="loadMoreBtn" class="loadmore-btn" type="button" hidden>Show older videos</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>CamiTube shows only the channels listed in <code>channels.json</code>. The video list refreshes automatically every few hours &mdash; no account or API key required.</p>
  </footer>

  <!-- Player overlay -->
  <div id="playerOverlay" class="player-overlay" hidden>
    <div class="player-shell">
      <button id="closePlayerBtn" class="close-player" type="button" aria-label="Close">✕</button>
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-meta">
        <h2 id="playerTitle"></h2>
        <p id="playerSub"></p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
